[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "firmware", "app", "rpi/runs", "rpi/datasets"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "ARG", "C4", "LOG", "G"]
ignore = [
    "E501",   # line-length handled by the formatter
    "RET504", # allow assignments before return when they aid readability
]

[tool.ruff.lint.per-file-ignores]
# Test doubles routinely take arguments they ignore: a stubbed detector is
# indexed by call count, and a scripted verdict client takes an event id it does
# not need. ARG005 fires on every one of them and burying the real signal.
"**/tests/*" = ["ARG001", "ARG002", "ARG005"]
"rpi/shield_rpi/enroll.py" = ["ARG002"]  # CLI passes args straight through

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.pytest.ini_options]
testpaths = ["rpi/tests", "backend/tests", "tools/tests"]
pythonpath = ["rpi", "backend"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]