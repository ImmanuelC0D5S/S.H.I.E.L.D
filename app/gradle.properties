org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX only. Jetifier rewrites legacy support-library references and is not
# needed for a project that starts on Jetpack from day one; leaving it on costs
# build time and occasionally mangles a dependency that needs no rewriting.
android.useAndroidX=true
android.enableJetifier=false

# Kotlin 2.x. Without this the Compose compiler silently does nothing.
kotlin.code.style=official

# Only debug builds of this app are expected; see HANDOFF.md for how the release
# keystore is handled. Never commit it.
android.nonTransitiveRClass=true