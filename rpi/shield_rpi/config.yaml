# S.H.I.E.L.D compute-node configuration.
#
# Single source of truth: docs/PROTOCOL.md section 7.
# Secrets are NOT here. They are ${VAR} references into .env.
# Never commit a real key.

camera:
  # Re-probed after the Logitech Brio 100 arrived (DECISIONS.md D-028):
  #   device 0 = laptop built-in - REJECTED, near-black (mean luma 3-7)
  #   device 1 = Logitech Brio 100  <- in use (mean luma 154-198)
  # The built-in was excluded on a luma >= 20 gate, not on guesswork. Device 0
  # reads a dark scene at every geometry and is assumed covered or disabled.
  # A dark camera is not a broken camera: it is unusable for training, which is
  # what the gate is for (DECISIONS.md D-025).
  # The index depends on enumeration order and shifts when a camera is plugged or
  # unplugged: re-probe with `python tools/camera_check.py` after any change.
  device: 1
  width: 1920
  height: 1080
  # MJPG matters on the RPi: uncompressed YUYV costs ~2x the bandwidth and
  # starves the burst grab. Camera.read() converts packed YUYV to BGR if a device
  # grants it anyway (DECISIONS.md D-024).
  # Kept at MJPG deliberately even though the Windows host readback reports YUY2
  # whatever is requested - OpenCV's DirectShow backend does not honour the
  # fourcc set, so that readback is not evidence about the RPi/Linux path. Do not
  # "fix" this to YUYV based on the host probe (D-028).
  fourcc: MJPG
  # Auto-exposure and auto-white-balance have not settled this early; early
  # frames are dark, blown out, or colour-shifted.
  warmup_frames: 10
  burst_frames: 5
  # A read slower than this means the camera or bus has stalled.
  stale_after_s: 2.0

detector:
  # D-026: the pretrained face detector the gate was scored with. This used to
  # read `../models/face.pt`, which never existed - the file the training run
  # would have produced (shield_step1_yolo_face.md) was never copied in. The
  # service therefore raised DetectorError on its first frame, not at startup,
  # which is the worst time to find out (D-047).
  face_model: ../models/face_pretrained.pt
  # Stock YOLOv8n for the person fallback (PROTOCOL 4.1 step 4: a body with no
  # usable face still has to produce a verdict). Also gitignored with the rest
  # of rpi/models/. Was a bare `yolov8n.pt`, which resolved to
  # rpi/shield_rpi/yolov8n.pt - a file nobody had ever downloaded - so
  # detect_person() raised too, on every frame of every pipeline run.
  person_model: ../models/yolov8n.pt
  imgsz: 640
  conf: 0.5

recognizer:
  faces_dir: ../known_faces
  # Cosine distance. 0.6 is dlib's own strict default; 0.5 is what PROTOCOL
  # section 7 specifies and is tighter. Raise if enrolled people fail to match.
  match_distance: 0.5
  # Below this confidence a detected face is treated as low_conf, not unknown.
  alert_confidence: 50

link:
  # The RPi hosts this AP; the ESP32 is the TCP client.
  #
  # Bind every interface, not one address. The ESP32 dials a specific IP
  # (192.168.50.1 on the Pi's own AP, 192.168.29.25 on a laptop), but the server
  # has to be reachable on whichever of those this host actually holds. Pinning
  # it to a single literal made the link die with WinError 10049 on any machine
  # that does not own that address - the bind failure only surfaced as a dead
  # daemon thread while the service kept reporting itself healthy.
  host: 0.0.0.0
  port: 8765
  heartbeat_s: 2
  reply_timeout_s: 5
  frame_timeout_s: 5
  max_body: 8192
  hmac_key: ${SHIELD_LINK_KEY}

supabase:
  # DECISIONS.md D-040: alerts go to Supabase, not to a FastAPI backend. The
  # backend/ directory is abandoned; `alerts.py` uploads the snapshot and
  # inserts one row, and the send-alert Edge Function does the FCM push from a
  # database webhook on that insert.
  url: ${SUPABASE_URL}
  # The shield_rpi role's bearer token, NOT the service-role key. Mint it with
  #   python tools/mint_role_token.py --role shield_rpi
  # The service-role key bypasses RLS entirely, which would make every policy in
  # supabase/migrations/20261003090100_shield_roles_grants.sql decorative.
  key: ${SUPABASE_RPI_TOKEN}
  # The project's own API key, used ONLY for the `apikey` header. PostgREST
  # validates that header against the project keys and returns 401 "Invalid API
  # key" for anything else -- including a valid role token, which is what this
  # used to send in this slot. The role travels in `Authorization` instead.
  # Publishable, not a secret; `supabase_get_publishable_keys` returns it.
  anon_key: ${SUPABASE_ANON_KEY}
  # Private bucket. image_url is a per-delivery signed URL minted by the Edge
  # Function, never a public path.
  bucket: snapshots
  # First path segment for uploads, so one device's footage is separable.
  device_prefix: ${SHIELD_DEVICE_ID}
  timeout_s: 10
  # PROTOCOL.md 3.3 caps a snapshot at 512 KB.
  max_snapshot_bytes: 524288
  # Durable retry for alerts that could not be published. Gitignored.
  queue_dir: ../runs/pending
  queue_max_attempts: 12

alert:
  # shield-rpi-prompt.md: ignore new triggers for this long after an alert.
  cooldown_s: ${COOLDOWN_S}
  snapshot_jpeg_quality: 80
  snapshot_max_edge_px: 1920

verdict:
  # shield-rpi-prompt.md: poll events.verdict every 2s up to VERDICT_TIMEOUT_S,
  # then escalate to the buzzer. The timeout that matches the Telegram fallback
  # is still TBD upstream; 60 s is the placeholder the prompt carries.
  timeout_s: ${VERDICT_TIMEOUT_S}
  poll_interval_s: 2
  # PROTOCOL.md 3.7 stop condition: give up polling an event after 10 minutes.
  hard_stop_s: 600

serial:
  # UART demo mode (shield-serial-bridge-prompt.md). The Pi's UART header, with
  # no Wi-Fi and no HMAC: PIR -> this line -> classify -> ALERT/SAFE back.
  #
  # Empty means off, which is the shipped default. Set to /dev/serial0 on the Pi
  # or COM5 on the laptop. NOT a security boundary -- see PROTOCOL.md 9.
  port: ""
  baud: 115200
  # The prompt fixes this at 2 s. Retrying faster would spin on a missing USB
  # adapter; slower makes an unplugged node look dead for no reason.
  reconnect_s: 2
  # Short, so the reader notices a yanked cable quickly. Classification runs on
  # this thread and can take a second, which is fine: the busy flag plus the
  # post-handle flush mean the lines that pile up meanwhile are discarded.
  read_timeout_s: 0.2